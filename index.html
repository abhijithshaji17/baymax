<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050606">
  <meta name="description" content="Baymax is your personal healthcare companion.">
  <title>Baymax</title>
  <link rel="icon" type="image/svg+xml" href="/assets/baymax-mark.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <main>
    <section class="opening-screen" id="baymax-opening" aria-label="Baymax">
      <div class="opening-eyes" role="img" aria-label="Baymax's eyes">
        <svg viewBox="0 0 576 1280" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <rect width="576" height="1280" fill="#050606"/>
          <g class="eyes-mark" transform="translate(6 80)">
            <g class="eyes-settle">
              <path class="eye-bridge" pathLength="177" d="M193 504h177"/>
              <circle class="eye-glow eye-glow-left" cx="162" cy="504" r="31"/>
              <circle class="eye-glow eye-glow-right" cx="401" cy="504" r="31"/>
              <g class="eye-blink"><circle class="eye eye-left" cx="162" cy="504" r="31"/></g>
              <g class="eye-blink"><circle class="eye eye-right" cx="401" cy="504" r="31"/></g>
            </g>
          </g>
        </svg>
      </div>
      <div class="opening-copy"><p>Hi, I’m Baymax.</p><span>Your personal healthcare companion</span></div>
      <nav class="opening-menu" aria-label="Baymax quick menu">
        <a href="#baymax-opening">Chat<span aria-hidden="true">↗</span></a>
      </nav>
    </section>
  </main>
</body>
</html>
