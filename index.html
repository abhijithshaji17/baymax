<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050606">
  <meta name="description" content="Baymax is your personal healthcare companion.">
  <title>Baymax</title>
  <link rel="icon" type="image/svg+xml" href="/assets/baymax-mark.svg?v=2">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="section-one.css">
  <link rel="stylesheet" href="section-three.css">
  <script src="section-one.js" defer></script>
  <script src="section-three.js" defer></script>
</head>
<body>
  <main>
    <section
      class="baymax-chapter"
      id="baymax-section-01"
      aria-label="Baymax, section one: First Contact"
    >
      <div class="chapter-stage">
        <div class="chapter-scene" aria-hidden="true">
          <img class="chapter-frame" src="/assets/section-01/frame-01.jpg" alt="">
          <img class="chapter-frame" src="/assets/section-01/frame-02.jpg" alt="">
          <img class="chapter-frame" src="/assets/section-01/frame-03.jpg" alt="">
          <img class="chapter-frame" src="/assets/section-01/frame-04.jpg" alt="">
          <img class="chapter-frame" src="/assets/section-01/frame-05.jpg" alt="">
          <img class="chapter-frame" src="/assets/section-01/frame-06.jpg" alt="">
          <div class="chapter-vignette"></div>
        </div>

        <h1 class="chapter-title" aria-label="Ouch">
          <span class="chapter-title-letters" aria-hidden="true"></span>
        </h1>
      </div>
    </section>

    <section class="opening-screen" id="baymax-opening" aria-label="Baymax">
      <div class="opening-eyes" role="img" aria-label="Baymax's eyes">
        <svg viewBox="0 0 576 1280" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <rect width="576" height="1280" fill="#fff"/>
          <g transform="translate(6 80)">
            <g class="eyes-settle">
              <path class="eye-bridge" pathLength="177" d="M193 504h177"/>
              <circle class="eye-glow eye-glow-left" cx="162" cy="504" r="31"/>
              <circle class="eye-glow eye-glow-right" cx="401" cy="504" r="31"/>
              <g class="eye-blink"><circle class="eye eye-left" cx="162" cy="504" r="31"/></g>
              <g class="eye-blink"><circle class="eye eye-right" cx="401" cy="504" r="31"/></g>
            </g>
          </g>
        </svg>
      </div>
      <div class="opening-copy"><p>Hi, I’m Baymax.</p><span>Your personal healthcare companion</span></div>
      <nav class="opening-menu" aria-label="Baymax quick menu">
        <a href="#baymax-pain-rating">Chat<span aria-hidden="true">↘</span></a>
      </nav>
    </section>

    <section class="pain-screen" id="baymax-pain-rating" aria-labelledby="pain-question">
      <div class="pain-panel">
        <h2 id="pain-question">On a scale of 1–10, how much would you rate your pain?</h2>
        <div class="pain-scale" role="group" aria-label="Rate your pain from 1 to 10"></div>
        <p class="pain-response" aria-live="polite"></p>
      </div>
      <div class="pain-meter" aria-hidden="true">
        <svg viewBox="0 0 180 180">
          <circle cx="90" cy="90" r="88"/>
          <path d="M2 88h38l20-27h58l21 27h39"/>
        </svg>
      </div>
    </section>
  </main>
</body>
</html>
